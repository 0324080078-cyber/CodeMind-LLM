apiVersion: apps/v1
kind: Deployment
metadata:
  name: codemind
  labels:
    app: codemind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codemind
  template:
    metadata:
      labels:
        app: codemind
    spec:
      containers:
        - name: codemind
          image: codemind:2.0.0
          ports:
            - containerPort: 8000
          env:
            - name: CODEMIND_ENV
              value: "production"
            - name: CODEMIND_API_KEY_REQUIRED
              value: "true"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: codemind
spec:
  selector:
    app: codemind
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
